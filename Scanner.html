<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validador de Entradas</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; margin: 0; background-color: #2c2c2c; color: white; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; min-height: 100vh; }
        .container { text-align: center; width: 100%; max-width: 600px; padding: 20px 15px; }
        h1 { border-bottom: 2px solid #555; padding-bottom: 10px; margin-bottom: 20px; }
        #start-button { padding: 15px 30px; font-size: 1.2em; font-weight: bold; color: white; background-color: #007bff; border: none; border-radius: 8px; cursor: pointer; margin: 20px; }
        #qr-reader { width: 90%; max-width: 500px; border-radius: 8px; margin: 20px auto; display: none; }
        #status-message { color: #aaa; min-height: 20px; }
        #qr-results-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; font-size: 2em; font-weight: bold; text-align: center; z-index: 9999; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        #qr-results-overlay.visible { opacity: 1; }
        #qr-results-overlay .icon { font-size: 3em; }
        .success { background-color: rgba(40, 167, 69, 0.95); }
        .error { background-color: rgba(220, 53, 69, 0.95); }
    </style>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>

</head>
<body>
    <div id="qr-results-overlay">
        <div class="icon"></div>
        <div class="message" style="margin-top:20px;"></div>
        <div class="sub-message" style="font-size: 0.6em; margin-top: 10px; font-weight: normal;"></div>
    </div>

    <div class="container">
        <h1>Validador de Entradas</h1>
        <button id="start-button" onclick="iniciarScanner()">📷 Iniciar Escáner</button>
        <div id="qr-reader"></div>
        <p id="status-message"></p>
    </div>

    <script>
        // --- CONFIGURACIÓN ---
        const SCRIPT_URL = "https://script.google.com/a/macros/iesalpujarra.org/s/AKfycbzV6a0bvDT1PiEzCZsP_z5iUXdSbltjO34BHBNaBnXiP9BBiNloakvUqUWx8qiMdohk0w/exec";

        let isScanning = true;
        let html5QrcodeScanner;

        const successSound = new Audio("https://github.com/antonioies/recursos/raw/refs/heads/main/success.mp3");
        const errorSound = new Audio("https://github.com/antonioies/recursos/raw/refs/heads/main/error.mp3");

        function iniciarScanner() {
            const startButton = document.getElementById('start-button');
            const qrReaderDiv = document.getElementById('qr-reader');
            const statusMessage = document.getElementById('status-message');

            startButton.style.display = 'none';
            qrReaderDiv.style.display = 'block';
            statusMessage.textContent = "Iniciando cámara...";

            // Esta comprobación es por si, aun así, la librería no cargase
            if (typeof Html5QrcodeScanner === "undefined") {
                statusMessage.textContent = "ERROR CRÍTICO: La librería del escáner no se pudo cargar.";
                return;
            }

            html5QrcodeScanner = new Html5QrcodeScanner("qr-reader", { 
                fps: 10, 
                qrbox: { width: 250, height: 250 },
                facingMode: "environment"
            });
            html5QrcodeScanner.render(onScanSuccess, onScanFailure);
        }

        function onScanSuccess(decodedText, decodedResult) {
            if (!isScanning) return;
            isScanning = false;
            html5QrcodeScanner.pause(true);

            // Llamada a la API de Google Apps Script SIN 'mode: no-cors'
            fetch(SCRIPT_URL, {
                method: 'POST',
                cache: 'no-cache',
                headers: {
                    'Content-Type': 'text/plain;charset=utf-8',
                },
                redirect: 'follow', // Se añade para gestionar redirecciones de Apps Script
                body: JSON.stringify({ codigo: decodedText })
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`Error de red: ${response.status} - ${response.statusText}`);
                }
                return response.json();
            })
            .then(data => {
                if (data && data.status === 'success') {
                    mostrarResultado(data.message);
                } else {
                    mostrarResultado(data.message || "Respuesta inválida del servidor.");
                }
            })
            .catch(error => {
                console.error('Error en fetch:', error);
                mostrarResultado(`Error de conexión: ${error.message}`);
            });
        }
        
        function onScanFailure(error) {
            // No hacemos nada para no mostrar errores constantes
        }

        function mostrarResultado(resultado) {
            const overlay = document.getElementById('qr-results-overlay');
            const iconEl = overlay.querySelector('.icon');
            const messageEl = overlay.querySelector('.message');
            const subMessageEl = overlay.querySelector('.sub-message');

            const isSuccess = resultado.includes('✅');
            
            if (isSuccess) {
                iconEl.textContent = '✅';
                messageEl.textContent = 'ACCESO PERMITIDO';
                overlay.className = 'success';
                successSound.play();
            } else {
                iconEl.textContent = '❌';
                messageEl.textContent = resultado.includes('YA USADA') ? 'ENTRADA YA USADA' : 'CÓDIGO NO VÁLIDO';
                overlay.className = 'error';
                errorSound.play();
                if (navigator.vibrate) navigator.vibrate(200);
            }
            subMessageEl.textContent = resultado;
            overlay.classList.add('visible');

            setTimeout(() => {
                overlay.classList.remove('visible');
                isScanning = true;
                if (html5QrcodeScanner.getState() === Html5QrcodeScannerState.PAUSED) {
                    html5QrcodeScanner.resume();
                }
            }, 2500);
        }
    </script>
</body>
</html>
